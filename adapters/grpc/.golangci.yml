# Module-scoped override of the repo root's .golangci.yml.
#
# golangci-lint resolves configuration by walking up from the working
# directory and stopping at the first file it finds — it does not merge a
# child config with a parent one. Running `golangci-lint run ./...` from
# inside this directory therefore uses this file, not
# ../../.golangci.yml, which is deliberate: the root config's
# "core-no-network" depguard rule bans importing google.golang.org/grpc and
# net/http in every non-test file it lints (docs/spec/02-adapter-contract.md
# / ADR-0037's go.mod-level enforcement is the real guarantee; that rule is
# its lint-level tripwire for the CORE module specifically). Applied to this
# module — whose entire job is to import google.golang.org/grpc — it would
# ban the package's own reason for existing. Every other linter, setting,
# and threshold below is copied from the root file unchanged: this module
# gets the same strictness, minus the one rule that does not apply to it.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - contextcheck
    - containedctx
    - noctx
    - exhaustive
    - revive
    - gocritic
    - ireturn
    - nilnil
    - paralleltest
    - tparallel
    - thelper
    - testifylint
    - gosec
    - prealloc
    - makezero
    - perfsprint
    - funlen
    - cyclop
    - gocognit
    - depguard
    - forbidigo

  settings:
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-strings
        - name: context-as-argument
        - name: unused-parameter
        - name: indent-error-flow
        - name: range-val-in-closure

    exhaustive:
      default-signifies-exhaustive: false
      check: [switch, map]

    ireturn:
      allow:
        - error
        - empty
        - anon
        - generic
        - stdlib
        # Same functional-options rationale as the core (ADR-0027), applied to
        # this adapter's own opaque Option type, plus the generated gRPC
        # client interfaces (WorkerServiceClient etc.), which grpc-go itself
        # defines as interfaces and which client.Dial legitimately returns.
        # ireturn reports these by import path, not by package identifier —
        # hence "adapters/grpc" rather than "grpcadapter" below.
        - "adapters/grpc\\.Option$"
        - "adapters/grpc/client\\.(WorkerOption|DialOption)$"
        - "gen/dagworker/v1\\.(WorkerServiceClient|ControlServiceClient)$"

    gocognit:
      min-complexity: 20

    cyclop:
      max-complexity: 15

    funlen:
      lines: 80
      statements: 50

    depguard:
      rules:
        main:
          deny:
            - pkg: "github.com/pkg/errors"
              desc: "use stdlib errors + fmt.Errorf(\"...: %w\", err) instead"
            - pkg: "io/ioutil"
              desc: "deprecated since Go 1.16; use io or os directly"

    forbidigo:
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: "use the configured slog.Logger, not fmt.Print*, in library code"

    gosec:
      excludes: [G104]

  exclusions:
    rules:
      - path: "_test\\.go"
        linters: [errcheck, gosec, funlen, cyclop, gocognit, containedctx]

      - path: "^gen/"
        linters:
          - errcheck
          - govet
          - staticcheck
          - ineffassign
          - unused
          - revive
          - gocritic
          - ireturn
          - nilnil
          - gosec
          - prealloc
          - makezero
          - perfsprint
          - funlen
          - cyclop
          - gocognit
          - contextcheck
          - containedctx
          - noctx
        # Generated code (protoc-gen-go / protoc-gen-go-grpc output, "DO NOT
        # EDIT"): its shape is the codegen template's, not a style choice
        # made in this repo, so it is out of scope for every style/complexity
        # linter. errcheck/staticcheck/unused stay off it for the same
        # reason bodyclose etc. never apply to it: nothing here is worth
        # hand-patching in a file the next `buf generate` overwrites anyway.

formatters:
  enable:
    - gofumpt
    - goimports
