//
// dagworker/v1/worker_service.proto — the surface a remote worker uses.
// Deliberately separate from ControlService (see control_service.proto) so a
// worker's credential never needs DAG-mutation privileges.
//
// Dispatch is a unary long poll (ClaimNode), exactly Temporal's
// PollActivityTaskQueue shape: one outstanding call per worker execution slot,
// with HTTP/2's own SETTINGS_MAX_CONCURRENT_STREAMS acting as the credit
// protocol. See docs/research/13-grpc-worker-protocol.md §1, §4.

syntax = "proto3";

package dagworker.v1;

option go_package = "github.com/specialistvlad/dagworker/adapters/grpc/gen/dagworker/v1;dagworkerv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "dagworker/v1/node.proto";

// WorkerService is the RPC surface a remote worker drives: claim a node, keep
// its lease alive, and report the outcome.
service WorkerService {
  // ClaimNode long-polls: it blocks server-side until a ready node in `scope`
  // exists or `poll_timeout` elapses, whichever is first. A response with
  // `lease` unset means "no work; call again" — an ordinary outcome, never an
  // error. Capacity is expressed by how many concurrent ClaimNode calls a
  // worker keeps open, not by a field on this message.
  rpc ClaimNode(ClaimNodeRequest) returns (ClaimNodeResponse);

  // ExtendLease is the heartbeat. It must be called again before
  // lease_expires_at or the node times out server-side and becomes claimable
  // again, subject to the scope's retry policy — independent of whether this
  // RPC's own deadline, or even the server process, is still alive at that
  // moment, because the deadline lives in storage, not in this process.
  rpc ExtendLease(ExtendLeaseRequest) returns (ExtendLeaseResponse);

  // CompleteNode reports success, fenced on the lease presented in task_token.
  rpc CompleteNode(CompleteNodeRequest) returns (CompleteNodeResponse);

  // FailNode reports that the attempt failed. Whether that ends the node or
  // schedules a retry is the scope's policy, never the worker's decision —
  // will_retry on the response says which happened.
  rpc FailNode(FailNodeRequest) returns (FailNodeResponse);

  // SkipNode reports that the worker looked and found nothing to do. Unlike
  // FailNode this is terminal on the first report: a retry would reach the
  // same conclusion. Kept as its own RPC, not a flag on FailNode, because
  // dagworker.Manager treats a skip as a distinct, non-retryable branch
  // primitive rather than a failure kind.
  rpc SkipNode(SkipNodeRequest) returns (SkipNodeResponse);
}

// ClaimNodeRequest asks for one ready node.
message ClaimNodeRequest {
  string scope = 1;
  // WorkerID identifies the claimant for observability only; it has no
  // bearing on correctness, which comes from the lease epoch alone.
  string worker_id = 2;
  // Kinds restricts the claim to these ready-set partitions. Empty claims
  // from any kind.
  repeated string kinds = 3;
  // LeaseDuration is the requested lease length; the server clamps it to the
  // scope's configured [min, max]. Zero uses the scope's default.
  google.protobuf.Duration lease_duration = 4;
  // PollTimeout bounds how long this call may block. The server clamps it to
  // its own maximum (600s, matching Nomad's blocking-query ceiling) and
  // returns an empty response rather than an error when it elapses.
  google.protobuf.Duration poll_timeout = 5;
  reserved 6 to 10;
}

// ClaimNodeResponse carries the lease, or nothing if poll_timeout elapsed
// with no ready node.
message ClaimNodeResponse {
  Lease lease = 1;
}

// ExtendLeaseRequest asks for more time on a lease.
message ExtendLeaseRequest {
  bytes task_token = 1;
  // RequestedExtension is the new duration, measured from the server's clock
  // at the moment it processes the request, never from the original grant.
  // Zero uses the scope's default lease duration.
  google.protobuf.Duration requested_extension = 2;
}

message ExtendLeaseResponse {
  google.protobuf.Timestamp lease_expires_at = 1;
}

// CompleteNodeRequest reports success.
message CompleteNodeRequest {
  bytes task_token = 1;
  // Result is the worker's output, stored on the node. Subject to the
  // scope's payload cap like any other payload.
  bytes result = 2;
}

message CompleteNodeResponse {}

// FailNodeRequest reports that an attempt did not succeed.
message FailNodeRequest {
  bytes task_token = 1;
  string message = 2;
}

message FailNodeResponse {
  // WillRetry is true when the failure was recorded as a retryable attempt
  // and the node returned to claimable rather than becoming terminal.
  bool will_retry = 1;
  // NextAttemptAt is set iff will_retry.
  google.protobuf.Timestamp next_attempt_at = 2;
}

// SkipNodeRequest reports that there was nothing to do.
message SkipNodeRequest {
  bytes task_token = 1;
  string reason = 2;
}

message SkipNodeResponse {}
