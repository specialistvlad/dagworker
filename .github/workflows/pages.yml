name: Pages

# Builds the documentation site at docs/site and publishes it to GitHub Pages.
# Runs on every pull request too, but only builds there — deploy is gated to
# main and manual dispatch — so a broken site fails the PR, not main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A single group, not one scoped by ref: GitHub Pages serves exactly one live
# deployment, so overlapping deploys must queue rather than race, which is
# what actions/deploy-pages's own template recommends.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # docs/site is an Astro/Starlight project and the only part of this
  # repository that is not Go. It is deliberately isolated: its own directory,
  # its own lockfile, its own job, and no entry in the root go.work or in the
  # Makefile's MODULES. Nothing here can reach `make check`, whose budget is
  # ten seconds and which never installs a package manager.
  NODE_VERSION: "22"

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        working-directory: docs/site
        run: npm ci

      # Builds src/content/docs from the repository's Markdown and then renders
      # it. `npm run build` runs the ingest step itself, so the two are never
      # out of step.
      - name: Build the site
        working-directory: docs/site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
