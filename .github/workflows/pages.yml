name: Pages

# Builds the documentation site at docs/site and publishes it to GitHub Pages.
# Runs on every pull request too, but only builds there — deploy is gated to
# main and manual dispatch — so a broken site fails the PR, not main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A single group, not one scoped by ref: GitHub Pages serves exactly one live
# deployment, so overlapping deploys must queue rather than race, which is
# what actions/deploy-pages's own template recommends.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GO_VERSION: "1.25"
  # docs/site sits inside the repository that owns the root go.work (see
  # docs/site/README.md's "Why GOWORK=off"); it is a standalone module, not
  # one of that workspace's `use` entries.
  GOWORK: "off"

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        working-directory: docs/site
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt would reformat the files above"
            exit 1
          fi

      - name: Test the generator
        working-directory: docs/site
        run: go test ./...

      - name: Generate the site
        working-directory: docs/site
        run: go run .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/public

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
